services:
  - type: web
    name: relax-api
    env: python
    buildCommand: pip install pyyaml && python3 scripts/sync_sources.py && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir renderapi --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
