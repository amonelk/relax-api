name: Keep Render Alive

on:
  schedule:
    # 每 10 分钟运行一次 (cron 表达式)
    # 格式：分 时 日 月 周
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击运行来测试

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service to prevent sleep
        run: |
          curl -X GET https://relax-api.onrender.com/healthy
          echo "Ping request sent at $(date)"
